<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Dungeon Crawler</title>
        <link href="./css/global.css" rel="stylesheet" />
        <link href="./css/debug.css" rel="stylesheet" />
        <link href="./css/mainStyle.css" rel="stylesheet" />
        <link href="./css/mapStyle.css" rel="stylesheet" />
        <script src="./scripts/mapLogic.js" defer></script>
        <script src="./scripts/playerLogic.js" defer></script>
        <script src="./scripts/debug.js" defer></script>
    </head>
    <body>
        <main>
            <div class="map-container">
                <div class="map-overlay"></div>
                <div class="map"></div>
            </div>
            <div class="log-container">
                <div class="log">
                    <div class="log-gradient"></div>
                    <div class="log-steps"></div>
                    <div class="log-text-container">
                        <div class="spacemaker"></div>
                    </div>
                </div>
            </div>
            <div class="controls-container">
                <label class="debug">
                    <input
                        type="checkbox"
                        name="checkbox"
                        autocomplete="off"
                        ;
                    />Debug
                </label>
                <div class="controls">
                    <div class="controls-item left"></div>
                    <div class="controls-item right"></div>
                    <div class="controls-item up"></div>
                    <div class="controls-item down"></div>
                </div>
            </div>
            <div class="info-container">
                <div class="info-text title">Dungeon Crawler</div>
                <div class="info-text subtitle">
                    Made by Rebecca Rupert in '26
                </div>
                <div class="divider"></div>
                <div class="info-text">
                    "P" stands for Player, "[X]" is a wall and "E" stands for
                    exit. <br />
                    Use WASD, the arrow keys or the buttons on-screen to move
                    around.
                </div>
            </div>
        </main>
    </body>
</html>
